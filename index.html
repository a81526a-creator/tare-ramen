<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tare 配方表產生器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#ffffff;
    --line:#1a1a1a;
    --hair:#c9c5bd;
    --panel:#f6f4ef;
    --panel-line:#e3ded2;
    --accent:#8a1f11;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    background:#e9e6de;
    color:var(--ink);
  }
  .app{
    max-width:1500px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header.page-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:8px;
  }
  header.page-head h1{
    font-size:22px;
    margin:0;
    letter-spacing:.05em;
  }
  header.page-head p{
    margin:2px 0 0;
    font-size:13px;
    color:#6b6558;
  }

  /* ---- control panel ---- */
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:26px;
  }
  .panel-row{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    align-items:flex-end;
    margin-bottom:16px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:12px;
    color:#6b6558;
  }
  .field input, .field select{
    font-family:inherit;
    font-size:14px;
    padding:7px 9px;
    border:1px solid #cfc9ba;
    border-radius:6px;
    background:#fff;
  }
  .field input[type="text"]{min-width:200px;}
  .field input[type="number"]{width:70px;}
  .field input, .field select, .input-table input{font-size:16px;} /* avoid iOS auto-zoom on focus */
  button{
    font-family:inherit;
    font-size:14px;
    padding:10px 16px;
    border-radius:6px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  button.secondary{
    background:#fff;
    color:var(--ink);
  }
  button.danger{
    background:#fff;
    color:var(--accent);
    border-color:var(--accent);
  }
  button:disabled{opacity:.4;cursor:not-allowed;}
  .status{
    font-size:12px;
    color:#8a8474;
    min-height:16px;
  }

  .input-table{
    width:100%;
    border-collapse:collapse;
    max-width:520px;
  }
  .input-table th, .input-table td{
    border:1px solid #d8d2c4;
    padding:6px 8px;
    text-align:center;
    font-size:14px;
  }
  .input-table th{
    background:var(--ink);
    color:#fff;
    font-weight:500;
  }
  .input-table td.label{
    text-align:left;
    background:#fbfaf6;
    white-space:nowrap;
  }
  .input-table input{
    width:100%;
    border:none;
    background:transparent;
    text-align:center;
    font-size:14px;
    font-family:inherit;
    padding:4px 2px;
  }
  .input-table input:focus{
    outline:2px solid var(--accent);
    outline-offset:-1px;
    background:#fff;
  }
  .input-table tr.group-start td{
    border-top:3px solid var(--ink);
  }

  /* ---- sheet preview ---- */
  .sheet-wrap{
    background:#dedad0;
    padding:24px;
    border-radius:10px;
    overflow-x:auto;
  }
  .sheet{
    background:var(--paper);
    display:flex;
    width:max-content;
    margin:0 auto;
  }
  .card{
    width:220px;
    padding:18px 14px 16px;
    position:relative;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
  }
  .card:first-child{border-left:1px solid var(--line);}
  .card:last-child{border-right:1px solid var(--line);}
  .cut{
    width:0;
    position:relative;
    border-left:1px dashed #9a9488;
  }
  .cut .scissor{
    position:absolute;
    left:-8px;
    font-size:14px;
    color:#4a4638;
    background:#fff;
  }
  .cut .scissor.top{top:-6px;}
  .cut .scissor.bottom{bottom:-6px;}

  .card .logo{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    margin-bottom:8px;
  }
  .card .bowl{
    width:52px;height:auto;flex:none;
  }
  .card .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    line-height:1.15;
  }
  .card .brand .name{
    font-size:10px;
    letter-spacing:.2em;
    color:#3a362c;
  }
  .card h2{
    font-size:22px;
    margin:0 0 10px;
    font-weight:700;
    letter-spacing:.03em;
  }
  .card table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
  }
  .card th{
    background:var(--ink);
    color:#fff;
    font-size:12px;
    font-weight:500;
    padding:6px 2px;
    border:1px solid var(--ink);
  }
  .card td{
    border:1px solid #cfcabd;
    font-size:12.5px;
    padding:7px 2px;
    text-align:center;
    height:26px;
  }
  .card td.label{
    background:#fbfaf6;
    font-weight:500;
  }
  .card tr.group-start td{
    border-top:2.5px solid var(--ink);
  }
  .card .foot{
    margin-top:10px;
    font-size:9.5px;
    color:#5c5748;
    text-align:center;
    line-height:1.5;
  }

  .copies-preview-note{
    font-size:12px;
    color:#7a745f;
    margin:10px 2px 0;
  }

  /* ---- fallback image modal (for browsers that block downloads/share) ---- */
  .img-modal{
    position:fixed;
    inset:0;
    background:rgba(20,18,14,.92);
    z-index:999;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
    overflow:auto;
  }
  .img-modal .hint{
    color:#fff;
    font-size:13px;
    text-align:center;
    margin:0 0 10px;
    max-width:520px;
  }
  .img-modal img{
    max-width:100%;
    background:#fff;
    border-radius:4px;
    box-shadow:0 6px 24px rgba(0,0,0,.4);
  }
  .img-modal button{
    margin-top:14px;
  }

  @media (max-width: 720px){
    .app{padding:16px 12px 40px;}
    header.page-head h1{font-size:18px;}
    header.page-head p{font-size:12px;}

    .panel{padding:16px 14px;border-radius:8px;}
    .panel-row{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:14px;}
    .field{width:100%;}
    .field input[type="text"]{min-width:0;width:100%;}
    .field input[type="number"]{width:100%;}
    .panel-row button{width:100%;margin:0;}
    #copies{max-width:120px;}

    .input-table th, .input-table td{padding:9px 6px;font-size:14px;}
    .input-table input{padding:8px 2px;}

    .sheet-wrap{padding:14px 10px;border-radius:8px;}
    .card{width:170px;padding:14px 10px 12px;}
    .card h2{font-size:18px;}
    .card th{font-size:10.5px;padding:5px 2px;}
    .card td{font-size:11px;padding:6px 2px;height:22px;}
    .card .foot{font-size:8.5px;}
    .copies-preview-note{font-size:11px;}
  }

  @media print{
    body{background:#fff;}
    .app{max-width:none;padding:0;}
    .page-head, .panel{display:none;}
    .sheet-wrap{background:#fff;padding:0;border-radius:0;overflow:visible;}
    .sheet{margin:0;}
    .copies-preview-note{display:none;}
    @page{size:landscape;margin:8mm;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="page-head">
    <div>
      <h1>Tare 配方表產生器</h1>
      <p>輸入一次配方，自動排版成可裁切的多份配方卡，直接列印。</p>
    </div>
  </header>

  <div class="panel">
    <div class="panel-row">
      <div class="field">
        <label for="recipeName">配方名稱（用於儲存 / 辨識）</label>
        <input type="text" id="recipeName" placeholder="例如：2026-08 秋季濃厚豚骨">
      </div>
      <div class="field">
        <label for="copies">列印份數</label>
        <input type="number" id="copies" value="6" min="1" max="10">
      </div>
      <div class="field">
        <label for="presetSelect">已儲存配方</label>
        <select id="presetSelect">
          <option value="">— 選擇載入 —</option>
        </select>
      </div>
      <button id="loadBtn" class="secondary">載入</button>
      <button id="saveBtn">儲存這份配方</button>
      <button id="deleteBtn" class="danger secondary">刪除</button>
      <button id="pdfBtn">分享 / 儲存 PDF</button>
      <button id="printBtn" class="secondary">直接列印（若無反應請改用左邊按鈕）</button>
    </div>
    <div class="status" id="status"></div>

    <table class="input-table" id="inputTable">
      <thead>
        <tr><th style="text-align:left;">材料</th><th>醬油</th><th>鹽味</th></tr>
      </thead>
      <tbody id="inputBody"></tbody>
    </table>
  </div>

  <div class="sheet-wrap">
    <div class="sheet" id="sheet"></div>
  </div>
  <p class="copies-preview-note">預覽僅顯示排版效果；實際列印會依「列印份數」輸出對應張數，並自動分頁。</p>

</div>

function bowlSVG(){
  return `<img class="bowl" src="${LOGO_DATA_URI}" alt="麵屋匠">`;
}

function buildInputRows(){
  inputBody.innerHTML = "";
  ALL_ROWS.forEach((name, idx) => {
    const tr = document.createElement('tr');
    if(idx === GROUP1.length) tr.classList.add('group-start');
    tr.innerHTML = `
      <td class="label">${name}</td>
      <td><input type="text" inputmode="decimal" data-row="${name}" data-col="shoyu"></td>
      <td><input type="text" inputmode="decimal" data-row="${name}" data-col="shio"></td>
    `;
    inputBody.appendChild(tr);
  });
  inputBody.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const {row, col} = e.target.dataset;
      recipe[row][col] = e.target.value;
      renderSheet();
    });
  });
}

function cardHTML(){
  let rows = "";
  ALL_ROWS.forEach((name, idx) => {
    const cls = idx === GROUP1.length ? ' class="group-start"' : '';
    const v = recipe[name];
    rows += `<tr${cls}><td class="label">${name}</td><td>${escapeHtml(v.shoyu)}</td><td>${escapeHtml(v.shio)}</td></tr>`;
  });
  return `
    <div class="logo">
      ${bowlSVG()}
      <div class="brand">
        <span class="name">麵屋匠</span>
      </div>
    </div>
    <h2>Tare 配方表</h2>
    <table>
      <thead><tr><th>材料</th><th>醬油</th><th>鹽味</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="foot">※ 本配方為麵屋匠內部使用，<br>請妥善保管。</div>
  `;
}

function escapeHtml(s){
  return (s ?? "").toString()
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function renderSheet(){
  const n = Math.max(1, Math.min(10, parseInt(copiesInput.value, 10) || 1));
  sheet.innerHTML = "";
  for(let i=0;i<n;i++){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = cardHTML();
    sheet.appendChild(card);
    if(i < n-1){
      const cut = document.createElement('div');
      cut.className = 'cut';
      cut.innerHTML = `<span class="scissor top">✂</span><span class="scissor bottom">✂</span>`;
      sheet.appendChild(cut);
    }
  }
}

copiesInput.addEventListener('input', renderSheet);

/* ---- persistence via window.storage ---- */
const INDEX_KEY = 'tare-recipe-index';

async function refreshPresetList(){
  presetSelect.innerHTML = '<option value="">— 選擇載入 —</option>';
  try{
    const idx = await window.storage.get(INDEX_KEY);
    const names = idx ? JSON.parse(idx.value) : [];
    names.forEach(n => {
      const opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      presetSelect.appendChild(opt);
    });
  }catch(e){ /* no presets yet */ }
}

async function saveRecipe(){
  const name = recipeNameInput.value.trim();
  if(!name){
    statusEl.textContent = '請先輸入配方名稱再儲存。';
    return;
  }
  try{
    await window.storage.set('tare-recipe:' + name, JSON.stringify(recipe));
    let names = [];
    try{
      const idx = await window.storage.get(INDEX_KEY);
      names = idx ? JSON.parse(idx.value) : [];
    }catch(e){ names = []; }
    if(!names.includes(name)){
      names.push(name);
      await window.storage.set(INDEX_KEY, JSON.stringify(names));
    }
    await refreshPresetList();
    presetSelect.value = name;
    statusEl.textContent = `已儲存「${name}」。`;
  }catch(e){
    statusEl.textContent = '儲存失敗，請稍後再試。';
  }
}

async function loadRecipe(){
  const name = presetSelect.value;
  if(!name){
    statusEl.textContent = '請先從清單選擇一份配方。';
    return;
  }
  try{
    const res = await window.storage.get('tare-recipe:' + name);
    if(res){
      recipe = JSON.parse(res.value);
      recipeNameInput.value = name;
      syncInputsFromRecipe();
      renderSheet();
      statusEl.textContent = `已載入「${name}」。`;
    }
  }catch(e){
    statusEl.textContent = '找不到這份配方。';
  }
}

async function deleteRecipe(){
  const name = presetSelect.value;
  if(!name){
    statusEl.textContent = '請先從清單選擇要刪除的配方。';
    return;
  }
  try{
    await window.storage.delete('tare-recipe:' + name);
    const idx = await window.storage.get(INDEX_KEY);
    let names = idx ? JSON.parse(idx.value) : [];
    names = names.filter(n => n !== name);
    await window.storage.set(INDEX_KEY, JSON.stringify(names));
    await refreshPresetList();
    statusEl.textContent = `已刪除「${name}」。`;
  }catch(e){
    statusEl.textContent = '刪除失敗，請稍後再試。';
  }
}

function syncInputsFromRecipe(){
  inputBody.querySelectorAll('input').forEach(inp => {
    const {row, col} = inp.dataset;
    inp.value = recipe[row] ? (recipe[row][col] ?? "") : "";
  });
}

document.getElementById('saveBtn').addEventListener('click', saveRecipe);
document.getElementById('loadBtn').addEventListener('click', loadRecipe);
document.getElementById('deleteBtn').addEventListener('click', deleteRecipe);
document.getElementById('printBtn').addEventListener('click', () => window.print());

/* ---- PDF export / share (avoids forced downloads, which get blocked in many mobile in-app browsers) ---- */
function showImageFallback(dataUrl){
  const modal = document.createElement('div');
  modal.className = 'img-modal';
  modal.innerHTML = `
    <p class="hint">請「長按圖片」選擇「儲存圖片」到相簿，之後即可從相簿列印。</p>
    <img src="${dataUrl}" alt="Tare 配方表">
    <button id="closeImgModal" class="secondary">關閉</button>
  `;
  document.body.appendChild(modal);
  document.getElementById('closeImgModal').addEventListener('click', () => modal.remove());
}

async function downloadPDF(){
  const btn = document.getElementById('pdfBtn');
  btn.disabled = true;
  statusEl.textContent = '正在產生內容…';
  let canvas;
  try{
    if(typeof html2canvas === 'undefined'){ throw new Error('html2canvas not loaded'); }
    canvas = await html2canvas(sheet, {scale: 3, backgroundColor: '#ffffff'});
  }catch(err){
    statusEl.textContent = '產生失敗，請改用「直接列印」或截圖畫面。';
    btn.disabled = false;
    return;
  }

  // Try native share sheet first (works well on mobile, doesn't trigger a blocked download)
  try{
    if(window.jspdf && navigator.canShare){
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 6;
      const availW = pageW - margin*2;
      const availH = pageH - margin*2;
      const ratio = Math.min(availW / canvas.width, availH / canvas.height);
      const w = canvas.width * ratio;
      const h = canvas.height * ratio;
      const x = (pageW - w) / 2;
      const y = (pageH - h) / 2;
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, w, h);
      const pdfBlob = pdf.output('blob');
      const pdfFile = new File([pdfBlob], 'Tare配方表.pdf', {type: 'application/pdf'});
      if(navigator.canShare({files: [pdfFile]})){
        await navigator.share({files: [pdfFile], title: 'Tare 配方表'});
        statusEl.textContent = '已開啟分享選單，可選擇「儲存檔案」或直接列印。';
        btn.disabled = false;
        return;
      }
    }
    throw new Error('share not available');
  }catch(shareErr){
    // Share unavailable, cancelled, or blocked — fall back to an inline image the user can long-press to save.
    showImageFallback(canvas.toDataURL('image/png'));
    statusEl.textContent = '已改用圖片預覽，請長按圖片儲存。';
    btn.disabled = false;
  }
}
document.getElementById('pdfBtn').addEventListener('click', downloadPDF);

buildInputRows();
renderSheet();
refreshPresetList();
</script>
