<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#faf8f3;
    --line:#1a1a1a;
    --hair:#ddd8cb;
    --panel:#f6f4ef;
    --panel-line:#e3ded2;
    --accent:#8a1f11;
    --good:#2f6b3e;
    --good-bg:#e7f2e9;
    color-scheme: light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    color:var(--ink);
    padding-top:env(safe-area-inset-top);
    overscroll-behavior-y:contain;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    padding:14px 16px calc(90px + env(safe-area-inset-bottom));
    min-height:100vh;
  }

  /* top bar */
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 2px 14px;
  }
  .topbar img{width:38px;height:auto;flex:none;}
  .topbar .titles{flex:1;}
  .topbar h1{font-size:17px;margin:0;font-weight:700;}
  .topbar p{font-size:11px;margin:1px 0 0;color:#7a745f;}

  .install-hint{
    background:#f1eee3;
    border:1px solid #e3ded0;
    border-radius:10px;
    padding:10px 12px;
    font-size:12px;
    color:#5c5748;
    margin-bottom:14px;
    line-height:1.5;
    display:none;
  }
  .install-hint.show{display:block;}
  .install-hint b{color:var(--ink);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ---- shared panel / field styles ---- */
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:16px 16px;
    margin-bottom:18px;
  }
  .panel-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:flex-end;
    margin-bottom:12px;
  }
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px;}
  .field label{font-size:12px;color:#6b6558;}
  .field input, .field select{
    font-family:inherit;font-size:16px;padding:9px 9px;
    border:1px solid #cfc9ba;border-radius:6px;background:#fff;width:100%;
  }
  button{
    font-family:inherit;font-size:14px;padding:10px 16px;border-radius:8px;
    border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
    touch-action:manipulation;
  }
  button.secondary{background:#fff;color:var(--ink);}
  button.danger{background:#fff;color:var(--accent);border-color:var(--accent);}
  button.block{width:100%;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .btn-row button{flex:1;min-width:110px;}
  .status{font-size:12px;color:#8a8474;min-height:16px;margin-top:6px;}

  .input-table{width:100%;border-collapse:collapse;}
  .input-table th, .input-table td{border:1px solid #d8d2c4;padding:8px 6px;text-align:center;font-size:14px;}
  .input-table th{background:var(--ink);color:#fff;font-weight:500;}
  .input-table td.label{text-align:left;background:#fbfaf6;white-space:nowrap;}
  .input-table input{width:100%;border:none;background:transparent;text-align:center;font-size:16px;font-family:inherit;padding:6px 2px;}
  .input-table input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:#fff;}
  .input-table tr.group-start td{border-top:3px solid var(--ink);}

  /* ---- print sheet preview ---- */
  .sheet-wrap{background:#dedad0;padding:16px;border-radius:10px;overflow-x:auto;margin-bottom:14px;}
  .sheet{background:#fff;display:flex;width:max-content;margin:0 auto;}
  .card{width:190px;padding:16px 12px 14px;position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .card:first-child{border-left:1px solid var(--line);}
  .card:last-child{border-right:1px solid var(--line);}
  .cut{width:0;position:relative;border-left:1px dashed #9a9488;}
  .cut .scissor{position:absolute;left:-8px;font-size:13px;color:#4a4638;background:#fff;}
  .cut .scissor.top{top:-6px;}
  .cut .scissor.bottom{bottom:-6px;}
  .card .logo{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:8px;}
  .card .bowl{width:44px;height:auto;flex:none;}
  .card .brand{display:flex;flex-direction:column;align-items:center;line-height:1.15;}
  .card .brand .name{font-size:9px;letter-spacing:.2em;color:#3a362c;}
  .card h2{font-size:19px;margin:0 0 9px;font-weight:700;letter-spacing:.03em;}
  .card table{width:100%;border-collapse:collapse;table-layout:fixed;}
  .card th{background:var(--ink);color:#fff;font-size:11px;font-weight:500;padding:5px 2px;border:1px solid var(--ink);}
  .card td{border:1px solid #cfcabd;font-size:11.5px;padding:6px 2px;text-align:center;height:24px;}
  .card td.label{background:#fbfaf6;font-weight:500;}
  .card tr.group-start td{border-top:2.5px solid var(--ink);}
  .card .foot{margin-top:9px;font-size:8.5px;color:#5c5748;text-align:center;line-height:1.5;}
  .copies-preview-note{font-size:11px;color:#7a745f;margin:0 2px 14px;}

  .img-modal{position:fixed;inset:0;background:rgba(20,18,14,.92);z-index:999;display:flex;flex-direction:column;align-items:center;padding:16px;overflow:auto;}
  .img-modal .hint{color:#fff;font-size:13px;text-align:center;margin:0 0 10px;max-width:520px;}
  .img-modal img{max-width:100%;background:#fff;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.4);}
  .img-modal button{margin-top:14px;}

  .backup-modal{position:fixed;inset:0;background:rgba(20,18,14,.85);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
  .backup-box{background:#fff;border-radius:12px;padding:18px;max-width:520px;width:100%;max-height:80vh;display:flex;flex-direction:column;gap:10px;}
  .backup-box h3{margin:0;font-size:15px;}
  .backup-box p{margin:0;font-size:12px;color:#6b6558;line-height:1.5;}
  .backup-box textarea{width:100%;flex:1;min-height:160px;font-family:monospace;font-size:12px;padding:10px;border:1px solid #cfc9ba;border-radius:8px;resize:vertical;}
  .backup-box .btn-row{margin:0;}

  /* ---- checklist ---- */
  .modeswitch{display:flex;background:#efece3;border-radius:10px;padding:4px;margin-bottom:14px;gap:4px;}
  .modeswitch button{flex:1;padding:10px 0;border:none;border-radius:8px;font-size:14px;font-weight:700;background:transparent;color:#6b6558;}
  .modeswitch button.active{background:var(--ink);color:#fff;}

  .progress-wrap{margin-bottom:14px;}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:#6b6558;margin-bottom:6px;}
  .progress-bar{height:8px;background:#e6e2d5;border-radius:5px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--good);width:0%;transition:width .25s ease;}

  .list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
  .item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:14px 14px;transition:background .15s ease, border-color .15s ease;}
  .item.done{background:var(--good-bg);border-color:#bcdcc2;}
  .item .check{width:26px;height:26px;border-radius:50%;border:2px solid #b9b3a2;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;transition:all .15s ease;}
  .item.done .check{background:var(--good);border-color:var(--good);color:#fff;}
  .item .name{flex:1;font-size:16px;font-weight:500;}
  .item.done .name{color:#4a4638;text-decoration:line-through;text-decoration-color:#9db8a0;}
  .item .amount{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;min-width:44px;text-align:right;}
  .item.done .amount{color:var(--good);}
  .item.empty{opacity:.4;}
  .section-label{font-size:12px;color:#8a8474;margin:4px 2px 2px;letter-spacing:.05em;}
  .empty-state{text-align:center;padding:40px 20px;color:#8a8474;font-size:14px;line-height:1.7;}

  /* ---- bottom tab bar ---- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;
    background:#fff;
    border-top:1px solid var(--hair);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    z-index:50;
  }
  .tabbar button{
    flex:1;
    background:transparent;
    border:none;
    color:#8a8474;
    font-size:11px;
    padding:8px 4px 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .tabbar button .ic{font-size:19px;line-height:1;}
  .tabbar button.active{color:var(--ink);font-weight:700;}

  @media print{
    body{background:#fff;}
    .app{max-width:none;padding:0;}
    .topbar, .install-hint, .tabbar, #tab-edit, #tab-check{display:none !important;}
    #tab-print .panel, #tab-print .copies-preview-note, #tab-print .btn-row{display:none !important;}
    .sheet-wrap{background:#fff;padding:0;border-radius:0;overflow:visible;}
    .sheet{margin:0;}
    @page{size:landscape;margin:8mm;}
  }
</style>
</head>

  <!-- ============ TAB 1: 編輯配方 ============ -->
  <section id="tab-edit" class="tab-panel active">
    <div class="panel">
      <div class="panel-row">
        <div class="field">
          <label for="recipeName">配方名稱</label>
          <input type="text" id="recipeName" placeholder="例如：2026-08 秋季濃厚豚骨">
        </div>
        <div class="field">
          <label for="presetSelect">已儲存配方</label>
          <select id="presetSelect"><option value="">— 選擇載入 —</option></select>
        </div>
      </div>
      <div class="btn-row">
        <button id="loadBtn" class="secondary">載入</button>
        <button id="saveBtn">儲存這份配方</button>
        <button id="deleteBtn" class="danger secondary">刪除</button>
      </div>
      <div class="status" id="statusEdit"></div>
    </div>

    <table class="input-table" id="inputTable">
      <thead><tr><th style="text-align:left;">材料</th><th>醬油</th><th>鹽味</th></tr></thead>
      <tbody id="inputBody"></tbody>
    </table>

    <div class="panel" style="margin-top:18px;">
      <div class="status" style="margin-top:0;margin-bottom:8px;">配方存在這台裝置的瀏覽器裡，換手機/換瀏覽器時請先「匯出」，再到新裝置「匯入」。</div>
      <div class="btn-row">
        <button id="exportBtn" class="secondary">匯出所有配方</button>
        <button id="importBtn" class="secondary">匯入配方</button>
      </div>
    </div>
  </section>

  <!-- ============ TAB 2: 列印表單 ============ -->
  <section id="tab-print" class="tab-panel">
    <div class="panel">
      <div class="panel-row">
        <div class="field">
          <label for="copies">列印份數</label>
          <input type="number" id="copies" value="6" min="1" max="10">
        </div>
      </div>
      <div class="btn-row">
        <button id="pdfBtn">分享 / 儲存 PDF</button>
        <button id="printBtn" class="secondary">直接列印</button>
      </div>
      <div class="status" id="statusPrint"></div>
    </div>

    <div class="sheet-wrap"><div class="sheet" id="sheet"></div></div>
    <p class="copies-preview-note">預覽僅顯示排版效果，實際輸出會依「列印份數」自動分頁。</p>
  </section>

  <!-- ============ TAB 3: 打勾確認 ============ -->
  <section id="tab-check" class="tab-panel">
    <div class="modeswitch">
      <button id="modeShoyu" class="active">醬油 Tare</button>

    </div>
    <div class="progress-wrap">

    </div>
    <div id="listArea"></div>
    <div class="btn-row">
      <button id="resetBtn" class="secondary">重置勾選</button>
      <button id="doneAllBtn">全部完成</button>
    </div>
  </section>

let recipe = {};
ALL_ROWS.forEach(r => recipe[r] = {shoyu:"", shio:""});
let checked = { shoyu:{}, shio:{} };
let checkMode = "shoyu";

/* ---------- elements ---------- */
const inputBody = document.getElementById('inputBody');
const sheet = document.getElementById('sheet');
const statusEdit = document.getElementById('statusEdit');
const statusPrint = document.getElementById('statusPrint');
const presetSelect = document.getElementById('presetSelect');
const recipeNameInput = document.getElementById('recipeName');
const copiesInput = document.getElementById('copies');
const installHint = document.getElementById('installHint');
const pageTitle = document.getElementById('pageTitle');
const pageSub = document.getElementById('pageSub');

function isStandalone(){
  return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}
if(!isStandalone()){ installHint.classList.add('show'); }

function escapeHtml(s){
  return (s ?? "").toString().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}

/* ---------- Tab switching ---------- */
const tabTitles = {
  edit:  ["Tare 配方表產生器", "輸入配方、排版列印、配製時逐項打勾"],
  print: ["列印表單", "可裁切的多份配方卡"],
  check: ["打勾確認", "配製時逐項確認，避免漏放"]
};
document.querySelectorAll('.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-' + tab).classList.add('active');
    const [t, s] = tabTitles[tab];
    pageTitle.textContent = t; pageSub.textContent = s;
    if(tab === 'print') renderSheet();
    if(tab === 'check') renderChecklist();
  });
});

/* ---------- Edit tab ---------- */
function buildInputRows(){
  inputBody.innerHTML = "";
  ALL_ROWS.forEach((name, idx) => {
    const tr = document.createElement('tr');
    if(idx === GROUP1.length) tr.classList.add('group-start');
    tr.innerHTML = `
      <td class="label">${name}</td>
      <td><input type="text" inputmode="decimal" data-row="${name}" data-col="shoyu"></td>
      <td><input type="text" inputmode="decimal" data-row="${name}" data-col="shio"></td>
    `;
    inputBody.appendChild(tr);
  });
  inputBody.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const {row, col} = e.target.dataset;
      recipe[row][col] = e.target.value;
    });
  });
}
function syncInputsFromRecipe(){
  inputBody.querySelectorAll('input').forEach(inp => {
    const {row, col} = inp.dataset;
    inp.value = recipe[row] ? (recipe[row][col] ?? "") : "";
  });
}

/* ---------- Print tab ---------- */
function bowlSVG(){
  return `<img class="bowl" src="${LOGO_DATA_URI}" alt="麵屋匠">`;
}
function cardHTML(){
  let rows = "";
  ALL_ROWS.forEach((name, idx) => {
    const cls = idx === GROUP1.length ? ' class="group-start"' : '';
    const v = recipe[name];
    rows += `<tr${cls}><td class="label">${name}</td><td>${escapeHtml(v.shoyu)}</td><td>${escapeHtml(v.shio)}</td></tr>`;
  });
  return `
    <div class="logo">${bowlSVG()}<div class="brand"><span class="name">麵屋匠</span></div></div>
    <h2>Tare 配方表</h2>
    <table><thead><tr><th>材料</th><th>醬油</th><th>鹽味</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="foot">※ 本配方為麵屋匠內部使用，<br>請妥善保管。</div>
  `;
}
function renderSheet(){
  const n = Math.max(1, Math.min(10, parseInt(copiesInput.value, 10) || 1));
  sheet.innerHTML = "";
  for(let i=0;i<n;i++){
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = cardHTML();
    sheet.appendChild(card);
    if(i < n-1){
      const cut = document.createElement('div');
      cut.className = 'cut';
      cut.innerHTML = `<span class="scissor top">✂</span><span class="scissor bottom">✂</span>`;
      sheet.appendChild(cut);
    }
  }
}
copiesInput.addEventListener('input', renderSheet);

function showImageFallback(dataUrl){
  const modal = document.createElement('div');
  modal.className = 'img-modal';
  modal.innerHTML = `
    <p class="hint">請「長按圖片」選擇「儲存圖片」到相簿，之後即可從相簿列印。</p>
    <img src="${dataUrl}" alt="Tare 配方表">
    <button id="closeImgModal" class="secondary">關閉</button>
  `;
  document.body.appendChild(modal);
  document.getElementById('closeImgModal').addEventListener('click', () => modal.remove());
}
async function downloadPDF(){
  const btn = document.getElementById('pdfBtn');
  btn.disabled = true;
  statusPrint.textContent = '正在產生內容…';
  let canvas;
  try{
    if(typeof html2canvas === 'undefined'){ throw new Error('html2canvas not loaded'); }
    canvas = await html2canvas(sheet, {scale: 3, backgroundColor: '#ffffff'});
  }catch(err){
    statusPrint.textContent = '產生失敗，請改用「直接列印」或截圖畫面。';
    btn.disabled = false;
    return;
  }
  try{
    if(window.jspdf && navigator.canShare){
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
      const pageW = pdf.internal.pageSize.getWidth();
      const pageH = pdf.internal.pageSize.getHeight();
      const margin = 6;
      const availW = pageW - margin*2, availH = pageH - margin*2;
      const ratio = Math.min(availW / canvas.width, availH / canvas.height);
      const w = canvas.width * ratio, h = canvas.height * ratio;
      const x = (pageW - w) / 2, y = (pageH - h) / 2;
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, w, h);
      const pdfBlob = pdf.output('blob');
      const pdfFile = new File([pdfBlob], 'Tare配方表.pdf', {type: 'application/pdf'});
      if(navigator.canShare({files: [pdfFile]})){
        await navigator.share({files: [pdfFile], title: 'Tare 配方表'});
        statusPrint.textContent = '已開啟分享選單，可選擇「儲存檔案」或直接列印。';
        btn.disabled = false;
        return;
      }
    }
    throw new Error('share not available');
  }catch(shareErr){
    showImageFallback(canvas.toDataURL('image/png'));
    statusPrint.textContent = '已改用圖片預覽，請長按圖片儲存。';
    btn.disabled = false;
  }
}
document.getElementById('pdfBtn').addEventListener('click', downloadPDF);
document.getElementById('printBtn').addEventListener('click', () => window.print());

/* ---------- Checklist tab ---------- */
const listArea = document.getElementById('listArea');
const progressText = document.getElementById('progressText');
const progressPct = document.getElementById('progressPct');
const progressFill = document.getElementById('progressFill');

function buildItem(name){
  const val = (recipe[name][checkMode] ?? "").toString().trim();
  const item = document.createElement('div');
  item.className = 'item';
  if(val === "") item.classList.add('empty');
  if(checked[checkMode][name]) item.classList.add('done');
  item.innerHTML = `
    <div class="check">✓</div>
    <div class="name">${name}</div>
    <div class="amount">${val === "" ? "—" : escapeHtml(val)}</div>
  `;
  if(val !== ""){
    item.addEventListener('click', () => {
      checked[checkMode][name] = !checked[checkMode][name];
      item.classList.toggle('done');
      updateProgress();
    });
  }
  return item;
}
function renderChecklist(){
  listArea.innerHTML = "";
  const hasAny = ALL_ROWS.some(r => (recipe[r][checkMode] ?? "").toString().trim() !== "");
  if(!hasAny){
    listArea.innerHTML = `<div class="empty-state">這個口味目前沒有配方數字。<br>請先到「編輯配方」分頁輸入配方。</div>`;
    updateProgress();
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'list';
  GROUP1.forEach(name => wrap.appendChild(buildItem(name)));
  const sectionLabel = document.createElement('div');
  sectionLabel.className = 'section-label';
  sectionLabel.textContent = '二次鹽 / 收尾';
  wrap.appendChild(sectionLabel);
  GROUP2.forEach(name => wrap.appendChild(buildItem(name)));
  listArea.appendChild(wrap);
  updateProgress();
}
function updateProgress(){
  const active = ALL_ROWS.filter(r => (recipe[r][checkMode] ?? "").toString().trim() !== "");
  const done = active.filter(r => checked[checkMode][r]).length;
  const total = active.length;
  progressText.textContent = `${done} / ${total} 已完成`;
  progressPct.textContent = total ? Math.round(done/total*100) + '%' : '0%';
  progressFill.style.width = total ? (done/total*100) + '%' : '0%';
}
document.getElementById('modeShoyu').addEventListener('click', () => {
  checkMode = 'shoyu';
  document.getElementById('modeShoyu').classList.add('active');
  document.getElementById('modeShio').classList.remove('active');
  renderChecklist();
});
document.getElementById('modeShio').addEventListener('click', () => {
  checkMode = 'shio';
  document.getElementById('modeShio').classList.add('active');
  document.getElementById('modeShoyu').classList.remove('active');
  renderChecklist();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  checked[checkMode] = {};
  renderChecklist();
});
document.getElementById('doneAllBtn').addEventListener('click', () => {
  ALL_ROWS.forEach(r => { if((recipe[r][checkMode] ?? "").toString().trim() !== "") checked[checkMode][r] = true; });
  renderChecklist();
});

/* ---------- persistence (localStorage — works on any real hosted page, per-device) ---------- */
const storage = {
  async get(key){
    const v = localStorage.getItem(key);
    if(v === null) throw new Error('not found: ' + key);
    return {key, value: v};
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return {key, value};
  },
  async delete(key){
    localStorage.removeItem(key);
    return {key, deleted: true};
  }
};
const INDEX_KEY = 'tare-recipe-index';
async function refreshPresetList(){
  presetSelect.innerHTML = '<option value="">— 選擇載入 —</option>';
  try{
    const idx = await storage.get(INDEX_KEY);
    const names = idx ? JSON.parse(idx.value) : [];
    names.forEach(n => {
      const opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      presetSelect.appendChild(opt);
    });
  }catch(e){ /* none yet */ }
}
async function saveRecipe(){
  const name = recipeNameInput.value.trim();
  if(!name){ statusEdit.textContent = '請先輸入配方名稱再儲存。'; return; }
  try{
    await storage.set('tare-recipe:' + name, JSON.stringify(recipe));
    let names = [];
    try{ const idx = await storage.get(INDEX_KEY); names = idx ? JSON.parse(idx.value) : []; }catch(e){ names = []; }
    if(!names.includes(name)){ names.push(name); await storage.set(INDEX_KEY, JSON.stringify(names)); }
    await refreshPresetList();
    presetSelect.value = name;
    statusEdit.textContent = `已儲存「${name}」。`;
  }catch(e){ statusEdit.textContent = '儲存失敗，請稍後再試。'; }
}
async function loadRecipe(){
  const name = presetSelect.value;
  if(!name){ statusEdit.textContent = '請先從清單選擇一份配方。'; return; }
  try{
    const res = await storage.get('tare-recipe:' + name);
    if(res){
      recipe = JSON.parse(res.value);
      recipeNameInput.value = name;
      syncInputsFromRecipe();
      renderSheet();
      checked = { shoyu:{}, shio:{} };
      renderChecklist();
      statusEdit.textContent = `已載入「${name}」。`;
    }
  }catch(e){ statusEdit.textContent = '找不到這份配方。'; }
}
async function deleteRecipe(){
  const name = presetSelect.value;
  if(!name){ statusEdit.textContent = '請先從清單選擇要刪除的配方。'; return; }
  try{
    await storage.delete('tare-recipe:' + name);
    const idx = await storage.get(INDEX_KEY);
    let names = idx ? JSON.parse(idx.value) : [];
    names = names.filter(n => n !== name);
    await storage.set(INDEX_KEY, JSON.stringify(names));
    await refreshPresetList();
    statusEdit.textContent = `已刪除「${name}」。`;
  }catch(e){ statusEdit.textContent = '刪除失敗，請稍後再試。'; }
}
document.getElementById('saveBtn').addEventListener('click', saveRecipe);
document.getElementById('loadBtn').addEventListener('click', loadRecipe);
document.getElementById('deleteBtn').addEventListener('click', deleteRecipe);

/* ---------- backup / restore across devices ---------- */
async function gatherAllRecipes(){
  let names = [];
  try{ const idx = await storage.get(INDEX_KEY); names = JSON.parse(idx.value); }catch(e){ names = []; }
  const data = {};
  for(const n of names){
    try{ const r = await storage.get('tare-recipe:' + n); data[n] = JSON.parse(r.value); }catch(e){}
  }
  return { names, data };
}

function showBackupModal({title, hint, value, onConfirm, confirmLabel}){
  const modal = document.createElement('div');
  modal.className = 'backup-modal';
  modal.innerHTML = `
    <div class="backup-box">
      <h3>${title}</h3>
      <p>${hint}</p>
      <textarea id="backupText">${value ? escapeHtml(value) : ''}</textarea>
      <div class="btn-row">
        <button id="backupClose" class="secondary">關閉</button>
        ${onConfirm ? `<button id="backupConfirm">${confirmLabel}</button>` : ''}
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('backupClose').addEventListener('click', () => modal.remove());
  if(onConfirm){
    document.getElementById('backupConfirm').addEventListener('click', async () => {
      const text = document.getElementById('backupText').value;
      await onConfirm(text);
      modal.remove();
    });
  }
  return modal;
}

document.getElementById('exportBtn').addEventListener('click', async () => {
  const { data } = await gatherAllRecipes();
  const json = JSON.stringify(data, null, 2);
  const modal = showBackupModal({
    title: '匯出所有配方',
    hint: '請全選、複製這段文字，傳到新裝置後用「匯入配方」貼上還原。',
    value: json
  });
  const ta = modal.querySelector('#backupText');
  ta.focus(); ta.select();
});

document.getElementById('importBtn').addEventListener('click', () => {
  showBackupModal({
    title: '匯入配方',
    hint: '請把從舊裝置匯出的文字貼在下面，再按「匯入」。這會新增/覆蓋同名配方，不會刪除現有其他配方。',
    value: '',
    confirmLabel: '匯入',
    onConfirm: async (text) => {
      try{
        const data = JSON.parse(text);
        let names = [];
        try{ const idx = await storage.get(INDEX_KEY); names = JSON.parse(idx.value); }catch(e){ names = []; }
        for(const [name, val] of Object.entries(data)){
          await storage.set('tare-recipe:' + name, JSON.stringify(val));
          if(!names.includes(name)) names.push(name);
        }
        await storage.set(INDEX_KEY, JSON.stringify(names));
        await refreshPresetList();
        statusEdit.textContent = `已匯入 ${Object.keys(data).length} 份配方。`;
      }catch(e){
        statusEdit.textContent = '匯入失敗，請確認貼上的文字完整且未經過修改。';
      }
    }
  });
});

/* ---------- init ---------- */
buildInputRows();
renderSheet();
renderChecklist();
refreshPresetList();
</script>
